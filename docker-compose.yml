version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: skypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skypilot}
      POSTGRES_USER: ${POSTGRES_USER:-skypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skypilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skypilot} -d ${POSTGRES_DB:-skypilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: skypilot-backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skypilot}
      DB_USERNAME: ${POSTGRES_USER:-skypilot}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-skypilot}
      JWT_SECRET: ${JWT_SECRET:-change-me-production-secret}
      AVIATION_DATA_PROVIDER: ${AVIATION_DATA_PROVIDER:-demo}
      AVIATION_DATA_BASE_URL: ${AVIATION_DATA_BASE_URL:-}
      AVIATION_DATA_API_KEY: ${AVIATION_DATA_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:55141,https://*.vercel.app,https://*.vercel.com}
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skypilot-frontend
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "4200:4200"

volumes:
  postgres_data:
