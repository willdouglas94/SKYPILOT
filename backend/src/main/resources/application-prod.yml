spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skypilot}
    username: ${DB_USERNAME:skypilot}
    password: ${DB_PASSWORD:skypilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-me-production-secret}
