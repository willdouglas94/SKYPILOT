spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skypilot}
    username: ${DB_USERNAME:skypilot}
    password: ${DB_PASSWORD:skypilot}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:change-me-production-secret}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.vercel.app,https://*.vercel.com}

aviation:
  data:
    provider: ${AVIATION_DATA_PROVIDER:demo}
    base-url: ${AVIATION_DATA_BASE_URL:}
    api-key: ${FLIGHTAWARE_API_KEY:${AVIATION_DATA_API_KEY:}}
