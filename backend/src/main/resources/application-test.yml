spring:
  datasource:
    url: jdbc:h2:mem:skypilot-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true

server:
  port: 8080

jwt:
  secret: skypilot-test-jwt-secret-2026-32-bytes-
