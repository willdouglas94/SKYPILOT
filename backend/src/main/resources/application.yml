spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:skypilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:skypilot-dev-jwt-secret-2026-32-bytes-long}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:55141,http://127.0.0.1:4200,http://127.0.0.1:55141,https://*.vercel.app,https://*.vercel.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

aviation:
  data:
    provider: ${AVIATION_DATA_PROVIDER:demo}
    base-url: ${AVIATION_DATA_BASE_URL:}
    api-key: ${FLIGHTAWARE_API_KEY:${AVIATION_DATA_API_KEY:}}
